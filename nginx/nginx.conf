user www-data;                         # Nginx worker process user
worker_processes auto;                 # Automatically determine number of worker processes
pid /run/nginx.pid;                    # PID file location
include /etc/nginx/modules-enabled/*.conf;

events {
    use epoll;                       # (Uncomment for Linux, efficient event method)
    worker_connections 1024;           # Max simultaneous connections per worker
    multi_accept on;                   # Accept as many connections as possible at once
}

http {
    sendfile on;                       # Enable efficient file transfers
    tcp_nopush on;                     # Send headers in one packet
    tcp_nodelay on;                    # Send data immediately, disable Nagle's algorithm
    keepalive_timeout 300s;            # Keep-alive timeout for client connections
    keepalive_requests 1000;           # Max requests per keep-alive connection
    reset_timedout_connection on;      # Reset connections after timeout
    types_hash_max_size 2048;          # Max size of types hash tables

    client_header_buffer_size 5120k;  # (Commented) Buffer size for client headers
    large_client_header_buffers 8 5120k; # (Commented) Number and size of large header buffers
    client_body_buffer_size 5120k;       # (Commented) Buffer size for client body

    # client_header_buffer_size 8k;      # Buffer size for client headers
    # large_client_header_buffers 4 16k;     # Number and size of large header buffers
    # client_body_buffer_size 32k;           # Buffer size for client body

    fastcgi_buffers 8 16k;             # Number and size of FastCGI buffers
    fastcgi_buffer_size 32k;           # Size of FastCGI buffer

    proxy_buffer_size 32k;             # Buffer size for proxied responses
    proxy_buffers 8 16k;               # Number and size of proxy buffers
    proxy_read_timeout 300s;           # Timeout for reading from proxied server
    proxy_connect_timeout 300s;        # Timeout for connecting to proxied server
    proxy_send_timeout 300s;           # Timeout for sending to proxied server

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Supported SSL/TLS protocols
    ssl_prefer_server_ciphers on;      # Prefer server ciphers over client ciphers

   
    log_format custom_log '$remote_addr - $host "$request" '
                      'status=$status '
                      'body_bytes_sent=$body_bytes_sent '
                      'request_length=$request_length '
                      'request_time=$request_time';
                      
    error_log /proc/self/fd/2 crit; # Error log location and level
    access_log /proc/self/fd/1 custom_log;

    include /etc/nginx/mime.types;     # File extension to MIME type mapping
    default_type application/octet-stream; # Default MIME type

    gzip on;                           # Enable gzip compression
    gzip_vary on;                      # Enable Vary header for proxies
    gzip_proxied any;                  # Enable gzip for all proxied requests
    gzip_comp_level 4;                 # Compression level (1-9)
    gzip_buffers 16 8k;                # Number and size of buffers for gzip
    gzip_http_version 1.1;             # Minimum HTTP version for gzip
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript; # MIME types to compress

    client_max_body_size 1024M;        # Max client request body size
    client_body_timeout 300s;           # Timeout for reading client body

    include /etc/nginx/conf.d/*.conf;  # Include additional config files
    include /etc/nginx/sites-enabled/*;# Include site-specific configs
}